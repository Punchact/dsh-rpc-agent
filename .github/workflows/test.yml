name: test

# Only the checks that need nothing but Node. `test/e2e.mjs` and `test/edge.mjs`
# drive a live DeepSeek Harness instance and cannot run on a hosted runner, so
# they stay a local, manual gate (see README "验证" / "Verify").
#
# `test/host.test.mjs` is different: it needs no Harness process, only the real
# `@deepseek-ai/dsh-host-webserver` package, so it runs here too — that is the
# whole point of keeping it a normal devDependency.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors engines: "^22.19.0 || >=24".
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Runtime stays dependency-free; these are the Host packages the
      # integration test mounts against, pinned in package.json.
      - name: Install dev dependencies
        run: npm ci

      - name: Syntax check every module
        run: |
          for file in index.mjs client.js lib/*.mjs bin/*.mjs test/*.mjs scripts/*.mjs; do
            node --check "$file"
          done

      - name: PLUGIN_VERSION matches package.json
        run: npm run check:version

      # 文档里的数字（RPC 方法数、MCP 工具数、测试文件数与用例数）必须与代码/计数文件一致。
      # 0.9.0 那几轮靠手工补丁改过七次同样的数字，这里把它变成门禁。
      - name: Documented counts match the code
        run: npm run check:docs

      # 方案（docs/api-surface.json 里的快照）与代码的接口面必须对得上：方案要求的要存在，
      # 代码里新增的要么补进方案、要么重新抽快照。0.9.0 就是靠这条抓出「方案写了、实现漏了」。
      - name: Plan surface matches the code
        run: npm run check:surface

      - name: Unit tests (no Harness required)
        run: npm test

      - name: Integration test against the real Host WebServer
        run: npm run test:host

      # The npm tarball is the artifact users install. `files` missing one entry
      # does not fail the install — it fails at the host's `import`, which the
      # user experiences as "the settings page is gone". Catch it at PR time.
      - name: Package contents are complete
        run: npm run check:package
