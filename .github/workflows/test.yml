name: test

# Only the checks that need nothing but Node. `test/e2e.mjs` and `test/edge.mjs`
# drive a live DeepSeek Harness instance and cannot run on a hosted runner, so
# they stay a local, manual gate (see README "验证" / "Verify").
#
# `test/host.test.mjs` is different: it needs no Harness process, only the real
# `@deepseek-ai/dsh-host-webserver` package, so it runs here too — that is the
# whole point of keeping it a normal devDependency.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors engines: "^22.19.0 || >=24".
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Runtime stays dependency-free; these are the Host packages the
      # integration test mounts against, pinned in package.json.
      - name: Install dev dependencies
        run: npm ci

      - name: Syntax check every module
        run: |
          for file in index.mjs client.js lib/*.mjs bin/*.mjs test/*.mjs; do
            node --check "$file"
          done

      - name: PLUGIN_VERSION matches package.json
        run: npm run check:version

      - name: Unit tests (no Harness required)
        run: npm test

      - name: Integration test against the real Host WebServer
        run: npm run test:host
