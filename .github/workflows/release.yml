name: release

# Publishing is driven by a GitHub Release, not by a tag push: the release is the moment a human
# says "this commit is what users get". `workflow_dispatch` exists so the identical job can be
# rehearsed without publishing anything.
#
# Authentication, in order of preference — the job is wired so either can carry it:
#
#   1. Trusted Publishing (OIDC). A Trusted Publisher is configured on npmjs.com for
#      Punchact / dsh-rpc-agent / release.yml, so `id-token: write` alone is enough and no secret
#      exists anywhere. Provenance comes out automatically once the repository is public.
#   2. Granular npm token with "bypass 2FA", stored as the repository secret NPM_TOKEN. npm's
#      site-wide policy makes 2FA or such a token mandatory, which is why a plain token answers
#      E403. The npm CLI tries OIDC first and falls back to this token, so the secret is invisible
#      to successful OIDC runs.
#   3. Neither: rehearse with `npm publish --dry-run` and say so, rather than failing a release over
#      a credential nobody has configured yet — and rather than pretending to have published.
#
# Two `workflow_dispatch` inputs exist purely for diagnosis and both default to off:
#   diagnose — print what the registry says about this repository's OIDC trust (an exchange
#              status), instead of inferring it from `npm publish`'s ENEEDAUTH.
#   stage    — perform a staged publish, which a Trusted Publisher always permits, to prove the
#              entry matches without moving `latest`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and pack, but do not publish"
        type: boolean
        default: true
      stage:
        description: "Diagnostic: upload as a staged publish instead of publishing to latest"
        type: boolean
        default: false
      diagnose:
        description: "Diagnostic: ask the registry why OIDC is or is not accepted, before publishing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci

      # A release whose tag and manifest disagree publishes a version nobody can find from the
      # tag, so refuse before anything is built.
      - name: tag matches package.json
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          actual="${GITHUB_REF#refs/tags/}"
          echo "tag: $actual   package.json: $expected"
          test "$actual" = "$expected"

      # Source lives in `src/**/*.mts`; `check:version` imports `./dist/lib/version.mjs` and
      # `check-docs`/`check-surface`/`check-release-path` inspect built `dist/` outputs.
      # Build MUST run before `check:version` on a clean checkout, otherwise `check:version`
      # fails with ERR_MODULE_NOT_FOUND when `dist/` does not exist yet.
      - run: npm run build
      - run: npm run check:version
      - run: npm run check:types
      - run: npm test
      - run: npm run test:host
      - run: npm run check:package
      - run: node scripts/check-release-path.mjs

      # What gets published has to be the thing that was verified. Packing here and handing the
      # tarball to the publish job removes the previous hole: that job rebuilt from the same commit
      # and published whatever the second build happened to produce, so the bytes users received
      # were never the bytes the checks ran against (quality review, 0.9.4 finding 1).
      - name: pack the verified tarball
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack ./dist --pack-destination artifacts
          (cd artifacts && sha256sum ./*.tgz | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          if-no-files-found: error
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS

  publish:
    name: publish
    needs: verify
    # A manual dispatch always reaches this job so the rehearsal prints the exact command; the
    # `dry_run` input only decides whether it is a rehearsal or a real publish (see the last step).
    # A release event has no inputs, so it publishes for real.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for Trusted Publishing; harmless when the token path is used instead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which Trusted Publishing needs (>= 11.5.1).
          node-version: "24.x"
          # No `registry-url` on purpose. With it, setup-node writes an ~/.npmrc holding
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # and with the secret absent that expands to an empty token. npm then sees a token
          # entry that exists but is useless, and answers ENEEDAUTH instead of falling through
          # to the OIDC exchange. The publish step writes ~/.npmrc itself, and only when a real
          # token exists.
          # Deliberately no dependency cache in the publishing job: a release build should not
          # reuse a download cache that something else could have poisoned.
      - run: npm ci
      # No build here on purpose. `npm ci` gives the job an npm CLI and nothing else; the publish
      # input is the tarball the verify job packed and checksummed, downloaded below. Building again
      # would publish bytes nobody verified (quality review, 0.9.4 finding 1).
      - name: fetch the verified tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: artifacts
      - name: the tarball is the verified one
        run: |
          set -euo pipefail
          ls -l artifacts
          (cd artifacts && sha256sum -c SHA256SUMS)
          # `./` matters: npm 11 resolves a bare relative path as a GitHub shorthand spec
          # (`artifacts/x.tgz` -> git ls-remote ssh://git@github.com/artifacts/x.tgz.git).
          TARBALL="./$(ls artifacts/*.tgz)"
          echo "tarball: ${TARBALL}"
          tar -xzOf "$TARBALL" package/package.json > /tmp/packed-package.json
          node -e 'const p=require("/tmp/packed-package.json"); console.log("packed version:", p.version, "files:", p.files.length)'
          diff <(node -e 'console.log(JSON.stringify(require("./package.json").version))') \
               <(node -e 'console.log(JSON.stringify(require("/tmp/packed-package.json").version))') \
            || { echo "::error::the tarball version does not match the checked-out commit"; exit 1; }
      - name: toolchain
        run: |
          echo "node $(node --version), npm $(npm --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC: request endpoint present — id-token: write is in effect"
          else
            echo "OIDC: request endpoint ABSENT — id-token: write did not reach this job"
          fi
      # Diagnostic only, never fatal, and opt-in: ask the registry directly why OIDC is or is not
      # accepted. `npm publish` collapses every authentication problem into ENEEDAUTH, which cannot
      # tell a missing Trusted Publisher apart from a mismatched workflow filename; the exchange
      # endpoint answers with a status code and a reason instead.
      #
      # Gated behind `diagnose` because a healthy release learns nothing from it: when a publish
      # answers ENEEDAUTH, re-dispatch this workflow on the same ref with dry_run=true and
      # diagnose=true, and read the exchange verdict instead of guessing.
      - name: oidc exchange probe
        if: ${{ inputs.diagnose == true }}
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "no OIDC endpoint in this job — id-token: write did not reach it"
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ID token request status: 000; request credentials unavailable (response body omitted)"
            exit 0
          fi
          TOKEN_BODY=$(mktemp)
          EXCHANGE_BODY=$(mktemp)
          trap 'rm -f "$TOKEN_BODY" "$EXCHANGE_BODY"' EXIT
          TOKEN_CODE=$(curl -sS -o "$TOKEN_BODY" -w '%{http_code}' \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" 2>/dev/null) || true
          TOKEN_CODE=${TOKEN_CODE:-000}
          ID_TOKEN=$(node -e 'try { const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if (typeof r.value === "string") process.stdout.write(r.value); } catch {}' "$TOKEN_BODY")
          if [ -z "$ID_TOKEN" ]; then
            echo "ID token request status: ${TOKEN_CODE}; token unavailable (response body omitted)"
            exit 0
          fi
          echo "ID token request status: ${TOKEN_CODE}"
          # Only these fixed, non-secret claims are emitted; token and response bodies stay private.
          printf '%s' "$ID_TOKEN" | node -e 'try { const p=JSON.parse(Buffer.from(require("fs").readFileSync(0,"utf8").split(".")[1],"base64url").toString()); for(const k of ["repository","repository_owner","repository_id","workflow_ref","job_workflow_ref","ref","event_name","environment"]) { if (typeof p[k] === "string" || typeof p[k] === "number") console.log("  "+k+" = "+JSON.stringify(p[k])); } } catch { console.log("  claims unavailable"); }'
          CODE=$(curl -sS -o "$EXCHANGE_BODY" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@punchact%2Fdsh-rpc-agent" 2>/dev/null) || true
          CODE=${CODE:-000}
          echo "exchange status: ${CODE} (response body omitted)"
      # No --provenance flag: npm generates provenance by itself for OIDC publishes from a public
      # repository, and refuses the flag outright for a private one.
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # `./` matters: npm 11 resolves a bare relative path as a GitHub shorthand spec
          # (`artifacts/x.tgz` -> git ls-remote ssh://git@github.com/artifacts/x.tgz.git).
          TARBALL="./$(ls artifacts/*.tgz)"
          VERSION=$(tar -xzOf "$TARBALL" package/package.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')
          echo "publishing ${VERSION} from ${TARBALL}"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
            echo "NPM_TOKEN is set — wrote it into ~/.npmrc (used only if OIDC is unavailable)"
          else
            echo "no NPM_TOKEN secret configured — relying on Trusted Publishing (OIDC)"
          fi

          real=0
          if [ "${{ github.event_name }}" = "release" ]; then real=1; fi
          if [ "${{ inputs.dry_run }}" = "false" ]; then real=1; fi

          if [ "$real" != "1" ]; then
            # A rehearsal on a commit whose version is already on the registry can never reach npm:
            # it answers "You cannot publish over the previously published versions". Rehearsing
            # again against an already-released commit is a normal thing to do, so report that state
            # and treat it as the end of the rehearsal instead of a failure. Nothing is lost: the
            # pack contents were already checked by `check:package` in the verify job.
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/@punchact%2Fdsh-rpc-agent/${VERSION}")
            if [ "$CODE" = "200" ]; then
              echo "rehearsal: @punchact/dsh-rpc-agent@${VERSION} is already on the registry"
              echo "::notice::version ${VERSION} already exists, so this rehearsal stops here — bump the version to rehearse a publish"
              exit 0
            fi
            echo "rehearsal: npm publish ${TARBALL} --access public --dry-run"
            npm publish "$TARBALL" --access public --dry-run
            exit 0
          fi

          # Diagnostic switch: `npm stage publish` is always permitted for a Trusted Publisher,
          # while `npm publish` needs the extra "Allowed actions" tick. Staging tells the two
          # failure modes apart — a staging publish that authenticates proves the entry matches.
          if [ "${{ inputs.stage }}" = "true" ]; then
            echo "diagnostic: npm stage publish ${TARBALL} --access public"
            npm stage publish "$TARBALL" --access public
            exit 0
          fi

          if npm publish "$TARBALL" --access public; then
            echo "published"
            exit 0
          fi
          echo "::error::publish failed. Check, in order: the Trusted Publisher entry on npmjs.com is"
          echo "::error::Punchact / dsh-rpc-agent / release.yml and allows 'npm publish' (new entries"
          echo "::error::default to stage-only); this workflow file name matches it exactly; or add a"
          echo "::error::bypass-2FA granular token as the secret NPM_TOKEN."
          exit 1
